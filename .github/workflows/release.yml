name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binaries:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            artifact: palmier.exe
          - os: ubuntu-latest
            label: linux-x64
            artifact: palmier
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --bin palmier

      # A smoke test on the runner: a binary that cannot start is not a build.
      # A binary that cannot start is not a build. The bare run is what a user gets
      # from double-clicking, so it is checked too.
      - name: Verify the binary runs
        shell: bash
        run: |
          ./target/release/${{ matrix.artifact }} --version
          ./target/release/${{ matrix.artifact }} --help
          ./target/release/${{ matrix.artifact }} < /dev/null | grep -q "not an installer"

      - uses: actions/upload-artifact@v4
        with:
          name: palmier-${{ matrix.label }}
          path: target/release/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30

  installer:
    name: installer · windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/palmier-app

      # The desktop shell is outside the workspace: it needs a system webview, which the
      # Linux development machine has no reason to install, so it is built here alone.
      # `tauri build` compiles and bundles in one pass.
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build and bundle
        working-directory: crates/palmier-app
        run: cargo tauri build

      - name: Show what was produced
        working-directory: crates/palmier-app
        shell: bash
        run: ls -la target/release/bundle/*/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: palmier-installer-windows
          path: |
            crates/palmier-app/target/release/bundle/msi/*.msi
            crates/palmier-app/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
