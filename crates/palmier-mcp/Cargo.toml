[package]
name = "palmier-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
palmier-core = { path = "../palmier-core" }
palmier-gen = { path = "../palmier-gen" }
palmier-media = { path = "../palmier-media" }
rmcp = { version = "3.1.4", features = ["server", "transport-streamable-http-server", "schemars", "transport-io"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tower-service = "0.3.3"
uuid = { version = "1.26.0", features = ["v4"] }

[dev-dependencies]
palmier-media = { path = "../palmier-media" }
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time"] }
