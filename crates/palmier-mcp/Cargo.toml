[package]
name = "palmier-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
palmier-core = { version = "0.0.1", path = "../palmier-core" }
palmier-media = { version = "0.0.1", path = "../palmier-media" }
rmcp = { version = "3.1.4", features = ["server", "transport-streamable-http-server", "schemars"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net"] }
